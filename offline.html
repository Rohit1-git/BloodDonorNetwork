
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#dc3545"
    >

    <title>
        Offline - Blood Donor Network
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff5f5,
                    #ffffff
                );

            color: #333;
        }

        .container {
            width: 90%;
            max-width: 500px;

            background: #ffffff;

            padding: 45px 30px;

            text-align: center;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);
        }

        .icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #dc3545;

            font-size: 45px;

            box-shadow:
                0 8px 20px
                rgba(220, 53, 69, 0.25);
        }

        h1 {
            margin-bottom: 12px;

            color: #dc3545;

            font-size: 30px;
        }

        p {
            line-height: 1.6;

            color: #666;

            margin-bottom: 25px;
        }

        .retry-btn {
            border: none;

            padding: 13px 28px;

            border-radius: 8px;

            background: #dc3545;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .retry-btn:hover {
            background: #bb2d3b;
        }

        .brand {
            margin-top: 25px;

            font-size: 14px;

            color: #999;
        }

    </style>

</head>


<body>


    <div class="container">

        <div class="icon">
            🩸
        </div>


        <h1>
            You're Offline
        </h1>


        <p>
            It looks like your internet connection
            is unavailable right now.
            Please check your connection and try again.
        </p>


        <button
            class="retry-btn"
            onclick="window.location.reload()"
        >
            🔄 Try Again
        </button>


        <div class="brand">
            Blood Donor Network
        </div>

    </div>


</body>

</html>
